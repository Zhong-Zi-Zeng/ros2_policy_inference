# Requires nvidia-container-toolkit on the host for the GPU reservations
# below, and Docker Compose v2.
#
#   docker compose up                 # launch inference_node
#   docker compose run --rm policy-inference bash   # interactive shell
#
# ROS_DOMAIN_ID and CHECKPOINT_DIR can be overridden via a .env file or
# `ROS_DOMAIN_ID=1 CHECKPOINT_DIR=/data/ckpt docker compose up`.
#
# Code is not baked into the image — this repo is mounted in and
# entrypoint.sh colcon-builds it on every container start, so a `git pull`
# on the host + a restart always runs whatever's currently checked out.

services:
  policy-inference:
    build:
      context: .
    image: lerobot_ros2:latest
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - .:/workspace/src/ros2_policy_inference
      - ${CHECKPOINT_DIR:-./checkpoints}:/checkpoints:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      ["ros2", "launch", "ros2_policy_inference", "inference.launch.py",
       "--ros-args", "-p", "policy_name:=act"]
