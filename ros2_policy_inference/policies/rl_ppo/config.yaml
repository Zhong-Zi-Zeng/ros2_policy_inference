# rl-template PickAndPlaceEnv checkpoint (rl_games) + scripted push knobs, read by rl_ppo_policy.py.
# Paths are inside the container (checkpoints/ is mounted at /checkpoints).
ckpt_path: "/checkpoints/rl_ppo/place.pth"

# PickAndPlaceEnvCfg.ee_action_pos_scale / ee_action_rot_scale: per policy step at 60 Hz
pos_scale: 0.010
rot_scale: 0.020
action_scale_mult: 0.5          # multiplier on the executed motion; 1.0 = as trained

# Orientation of the frame /il/grasp/action is expressed in, seen from the sim env frame (w, x, y, z).
# Default = the USD robot root (RS_M90E7A init_state.rot), i.e. assumes the controller uses the robot base frame.
out_frame_quat_wxyz: [0.61222, -0.61183, -0.3545, 0.35382]
euler_order: "xyz"

# Scripted push (PickAndPlaceEnvCfg.push_*)
push_min_steps: 60
push_stall_window: 20
push_stall_dist: 0.001          # m
push_stall_ang_deg: 0.2
push_speed: 0.00025             # m / step
push_max_travel: 0.10           # m
push_force_stop: 15.0           # N, change of |force| since the push started
max_steps: 600                  # 10 s at 60 Hz, same as the training episode

# Optional:
# device: "cuda"
# warmup: true