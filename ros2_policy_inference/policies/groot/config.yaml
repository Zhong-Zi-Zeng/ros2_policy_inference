# GR00T N1.7 checkpoint + inference knobs, read by groot_policy.py. Paths are inside the container
# (checkpoints/ is mounted at /checkpoints). Expects a LeRobot-trained GR00T checkpoint
# (config.json + model weights + policy_preprocessor.json / policy_postprocessor.json).
ckpt_path: "/checkpoints/gr00t_grasp-fan_Le-002_20k_v1"
task: "pick up the fan by its handle"
state_keys: [joint_pos, gripper_state]

# IL grasp — overrides request_topic/chunk_topic in config/params.yaml.
request_topic: "/il/grasp/request"
chunk_topic: "/il/grasp/action_chunk"

# Which obs each of the checkpoint's image features comes from, and how to encode it.
# Must cover every image feature the checkpoint declares. encoding: rgb | depth
# (depth needs info_path, and must match the dataset conversion).
cameras:
  observation.images.wrist:
    source: rgb
    encoding: rgb
  observation.images.depth:
    source: depth
    encoding: depth
    info_path: "/checkpoints/gr00t_grasp-fan_Le-002_20k_v1/depth_info.json"

# Optional (unset = checkpoint default / auto):
# device: "cuda"
# n_action_steps: 16
# warmup: true
