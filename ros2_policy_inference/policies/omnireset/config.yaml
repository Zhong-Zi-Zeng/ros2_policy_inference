# rl-template OmniResetEnv student, read by omnireset_policy.py. Paths are inside the container
# (checkpoints/ is mounted at /checkpoints).
# - distill_student.py checkpoint (student_best.pth): stores its camera setup itself.
# - rl_games checkpoint (RL fine-tune, nn/*.pth): copy the run's params/env.yaml next to it as <name>.env.yaml.
# The network (conv2d / resnet, image channels) is read from the weights.
ckpt_path: "/checkpoints/omnireset/d24b.pth"

# Node settings for `./run_docker.sh --policy-name omnireset` (read by launch/inference.launch.py; a key:=value
# launch argument on the command line still wins). Anything not set here comes from config/params.yaml.
node:
  action_topic: "/rl/insert/action"   # delta_extension: what its RL insert policy (Fan Insert Mode RL) subscribes to
  inference_rate_hz: 30.0             # the rate OmniResetEnv trains the policy at
  # true: step on /clock, which delta_extension's Test Place publishes (Isaac Sim time) only while inserting, so the
  # policy runs at 30 Hz of sim time and stops with the insertion. Set false where nothing publishes /clock: the node
  # would wait forever.
  use_sim_time: true

# OmniResetEnvCfg.ee_action_pos_scale / ee_action_rot_scale: per policy step at 30 Hz
pos_scale: 0.005
rot_scale: 0.010
# multiplier on the executed motion; training randomized it per axis in [0.8, 1.2], so 0.8 is the
# slowest setting the policy has seen
action_scale_mult: 0.8

# Orientation of the frame the action is expressed in, seen from the sim env frame (w, x, y, z).
# [1, 0, 0, 0] = world (= sim env) frame, which delta_extension's DeltaActionPolicy expects. The robot base frame would be
# the USD robot root (RS_M90E7A init_state.rot) [0.61222, -0.61183, -0.3545, 0.35382].
out_frame_quat_wxyz: [1, 0,0,0]
euler_order: "xyz"

# The policy also outputs a gripper command; opening drops the fan, so it is held closed unless this is true.
allow_gripper_open: false
max_steps: 999999                  # policy steps before it holds still (300 = 10 s at 30 Hz, the training episode)

# Per-step random image shift of +-N px, as in training (aug_step_shift_px = 4). 0 = the steady real image.
step_shift_px: 0

# Optional:
# device: "cuda"
# warmup: true
